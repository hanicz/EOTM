spring.main.banner-mode=off

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db,redis

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.data.redis.repositories.enabled=false

totp.key=${EOTM_TOTP_KEY:}
totp.salt=${EOTM_TOTP_SALT:}

cache.stockTTL=259200000

reddit.logo=https://www.redditinc.com/assets/images/site/Reddit_Icon_FullColor-1_2023-11-29-161416_munx.jpg
reddit.url=https://www.reddit.com