# nginx.conf
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;

  map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
  }

  limit_req_zone $login_limit_key    zone=login_zone:10m  rate=10r/m;
  limit_req_zone $binary_remote_addr zone=signup_zone:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=report_send_zone:10m rate=2r/m;
  limit_req_status 429;
  limit_req_log_level warn;

  server {
    listen 80;
    listen [::]:80;
    server_name xx.hu www.xx.hu;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xx.hu www.xx.hu;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/xx.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xx.hu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 4m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ "^/login(?:[/;]|$)" {
      limit_req zone=login_zone burst=5 nodelay;
      proxy_pass http://app:8080;
    }

    location ~ "^/api/v1/user/signup(?:[/;]|$)" {
      limit_req zone=signup_zone burst=3 nodelay;
      proxy_pass http://app:8080;
    }

    location ~ "^/api/v1/report/monthly/send(?:[/;]|$)" {
      limit_req zone=report_send_zone burst=2 nodelay;
      proxy_pass http://app:8080;
    }

    location / {
      proxy_pass http://app:8080;
    }
  }
}
