<div class="app-shell">
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  @if (showWatchlist) {
    <aside class="app-watchlist" [class.app-watchlist-open]="watchlistOpen">
      <app-watchlist></app-watchlist>
    </aside>
    @if (watchlistOpen) {
      <div class="app-watchlist-backdrop" (click)="closeWatchlist()"></div>
    }
  }
</div>
