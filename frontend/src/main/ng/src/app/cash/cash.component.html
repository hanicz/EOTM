<p-toast position="bottom-center"></p-toast>
<div class="shadow-5">
  <menu class="pl-0 mb-0"></menu>
  <p-panel>

    <p class="form-hint">
      Money sitting in an account rather than invested. It counts towards your net worth at face value, so
      it never shows a gain or a loss.
    </p>

    <section class="form-section">
      <h3 class="form-section-title">Balance</h3>
      <div class="form-row">
        <div class="form-field form-field-wide">
          <label for="cashAmount" class="form-label">Cash</label>
          @if (loading) {
            <p-skeleton height="2.5rem"></p-skeleton>
          } @else {
            <p-inputnumber inputId="cashAmount" [(ngModel)]="amount" [min]="0" placeholder="0"
              [suffix]="' ' + currency" (keyup.enter)="save()"></p-inputnumber>
          }
        </div>
        <div class="form-field form-field-wide">
          <label for="cashCurrency" class="form-label">Currency</label>
          @if (loading) {
            <p-skeleton height="2.5rem"></p-skeleton>
          } @else {
            <p-select inputId="cashCurrency" [options]="currencies" [(ngModel)]="currency"
              optionLabel="label" optionValue="value"></p-select>
          }
        </div>
      </div>
      <div class="form-actions">
        <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-rounded"
          [loading]="saving" [disabled]="loading" (click)="save()"></button>
      </div>
    </section>

  </p-panel>
</div>
