<p-menubar [model]="items" breakpoint="992px">
  <ng-template pTemplate="start">
    <a class="logo-link" routerLink="/dashboard" aria-label="Dashboard">
      <img class="logo" [src]="assetUrl + 'logo-horizontal.png'" alt="Eye OTM">
    </a>
  </ng-template>
  <ng-template pTemplate="end">
    <div class="toolbar">
      <div class="user-section">
        <span class="user-email">{{ user.email }}</span>
        <button
          pButton
          pRipple
          type="button"
          icon="pi pi-cog"
          aria-label="Settings"
          routerLink="/settings"
          class="p-button-rounded p-button-primary">
        </button>
        <button
          pButton
          pRipple
          type="button"
          icon="pi pi-star"
          aria-label="Toggle watchlist"
          (click)="toggleWatchlist()"
          class="p-button-rounded p-button-primary watchlist-toggle">
        </button>
        <button
          pButton
          pRipple
          type="button"
          icon="pi pi-sign-out"
          aria-label="Log out"
          (click)="logOut()"
          class="p-button-rounded p-button-primary">
        </button>
      </div>
    </div>
  </ng-template>
</p-menubar>
