<p-toast position="bottom-center"></p-toast>
<p-toolbar styleClass="table-toolbar">
    <ng-template pTemplate="left">
        <button pButton pRipple label="New" icon="pi pi-plus"
            (click)="openNew()"></button>
        <button pButton pRipple icon="pi pi-trash" severity="danger" class="p-button-outlined"
            [disabled]="!selectedDividends || !selectedDividends.length" (click)="deleteClicked()"></button>
    </ng-template>

    <ng-template pTemplate="right">
        <p-fileUpload mode="basic" #fileUpload accept=".csv" [customUpload]="true" [auto]="true" label="Import" chooseLabel="Import" chooseStyleClass="p-button-outlined p-button-secondary" (uploadHandler)="onUpload($event)">
        </p-fileUpload>
        <button pButton pRipple label="Export" icon="pi pi-upload" severity="secondary" class="p-button-outlined" (click)="download()"></button>
    </ng-template>
</p-toolbar>
<p-table #dt1 [value]="dividends" styleClass="p-datatable-striped table-stack eotm-table"
    [(selection)]="selectedDividends" [paginator]="true" [rows]="25">

    <ng-template pTemplate="caption">
        <div class="filter-bar">
            <input pInputText type="text"
                (input)="dt1.filter($any($event.target)?.value, 'shortName', 'contains')"
                [value]="$any(dt1.filters['shortName'])?.value ?? ''" placeholder="Search by Name"
                class="p-column-filter filter-input">
        </div>
    </ng-template>
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 3rem">
                <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
            </th>
            <th pSortableColumn="shortName">Stock Name <p-sortIcon field="shortName"></p-sortIcon></th>
            <th class="cell-num" pSortableColumn="amount">Amount <p-sortIcon field="amount"></p-sortIcon></th>
            <th pSortableColumn="dividendDate">Date <p-sortIcon field="dividendDate"></p-sortIcon></th>
            <th></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-dividend>
        <tr>
            <td>
                <p-tableCheckbox [value]="dividend"></p-tableCheckbox>
            </td>
            <td data-label="Stock Name">
                <app-ticker-identity [exchange]="dividend.exchange" [symbol]="dividend.shortName"
                        [name]="dividend.name"></app-ticker-identity>
            </td>
            <td data-label="Amount" class="cell-num">{{dividend.amount | currency : dividend.currencyId : 'symbol' : '0.0-2'}}</td>
            <td data-label="Date">{{dividend.dividendDate | date:'mediumDate'}}</td>
            <td>
                <button pButton pRipple type="button" icon="pi pi-pencil" (click)="editDividend(dividend)"
                    class="p-button-rounded p-button-text mr-1" severity="info"></button>
                <button pButton pRipple type="button" icon="pi pi-times" (click)="deleteByIds(dividend.dividendId)"
                    class="p-button-rounded p-button-text ml-2" severity="danger"></button>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="5">
                <div class="table-empty">
                    <i class="pi pi-wallet"></i>
                    <span class="table-empty-title">No dividends yet</span>
                    <span>Use New to record a dividend payment.</span>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="dividendDialog" [style]="{width: '50vw'}" [breakpoints]="{'992px': '75vw', '576px': '100vw'}" header="Dividend Details" [modal]="true"
    styleClass="p-fluid">
    <ng-template pTemplate="content">
        <div class="grid">
            <div class="col-12 mb-2">
                <label for="exchange" class="block mb-2 font-medium text-color-secondary">Exchange</label>
                <p-select class="searchDropdown" [options]="exchanges" optionLabel="Name" [virtualScroll]="true"
                    [virtualScrollItemSize]="31" [filter]="true" filterBy="Name,Code"
                    filterPlaceholder="Search by name or code"
                    (onChange)="exchangeChanged($event)" [(ngModel)]="selectedExchange"
                    placeholder="Select an Exchange" [style]="{'width':'100%'}"
                    [dropdownIcon]="exchangesLoading ? 'pi pi-spinner pi-spin' : 'pi pi-chevron-down'">
                    <ng-template let-option pTemplate="item">
                        <app-exchange-option [exchange]="option"></app-exchange-option>
                    </ng-template>
                    <ng-template let-option pTemplate="selectedItem">
                        <app-exchange-option [exchange]="option" [dense]="true"></app-exchange-option>
                    </ng-template>
                </p-select>
            </div>
            <div class="col-12 mb-2">
                <label for="ticker" class="block mb-2 font-medium text-color-secondary">Ticker</label>
                <p-select class="searchDropdown" [options]="symbols" optionLabel="Name" [virtualScroll]="true"
                    [virtualScrollItemSize]="46" [filter]="true" filterBy="Name,Code,Isin"
                    filterPlaceholder="Search by name, code or ISIN"
                    [(ngModel)]="selectedStock" placeholder="Select a Ticker"
                    [style]="{'width':'100%'}"
                    [dropdownIcon]="stocksLoading ? 'pi pi-spinner pi-spin' : 'pi pi-chevron-down'">
                    <ng-template let-option pTemplate="item">
                        <app-symbol-option [symbol]="option"></app-symbol-option>
                    </ng-template>
                    <ng-template let-option pTemplate="selectedItem">
                        <app-symbol-option [symbol]="option" [dense]="true"></app-symbol-option>
                    </ng-template>
                </p-select>
            </div>
            <div class="col-12 sm:col-6 mb-2">
                <label for="currency" class="block mb-2 font-medium text-color-secondary">Currency</label>
                <p-select [options]="currencies" [(ngModel)]="dividend.currencyId" id="currency" optionLabel="label"
                    optionValue="value" [style]="{'width':'100%'}"></p-select>
            </div>
            <div class="col-12 sm:col-6 mb-2">
                <label for="amount" class="block mb-2 font-medium text-color-secondary">Amount</label>
                <input type="number" pInputText id="amount" [(ngModel)]="dividend.amount" class="w-full" />
            </div>
            <div class="col-12 mb-2">
                <label for="date" class="block mb-2 font-medium text-color-secondary">Date</label>
                <input type="text" pInputText id="date" placeholder="YYYY-MM-DD" [(ngModel)]="dividend.dividendDate"
                    class="w-full" />
            </div>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-text" (click)="saveDividend()"></button>
    </ng-template>
</p-dialog>
